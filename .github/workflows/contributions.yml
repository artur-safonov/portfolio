name: Update contribution chart

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify daily refresh behavior
        run: node --test tests/update-contributions.test.mjs
      - name: Refresh yearly contributions
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/update-contributions.mjs
      - name: Commit when the chart changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          git diff --cached --quiet || (git commit -m "Update contribution chart" && git push)
      - name: Publish the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a29527ad9ae20fe5f184e28b23b5ed69
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare token; the live page reads the chart from GitHub."
            exit 0
          fi
          npx --yes wrangler pages deploy . --project-name artursafonov-portfolio --branch main --commit-dirty=true
